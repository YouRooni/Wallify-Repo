<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Android 4 Light Grid</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a0c;touch-action:none}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>
(()=>{'use strict';const c=document.getElementById('c'),x=c.getContext('2d',{alpha:false}),D={density:'34',speed:'normal',glow:'75',brightness:'82',motion:'flow',palette:'classic',barCount:'18',parallax:'12',darkness:'78',seed:'4'};let cfg={},W=0,H=0,dpr=1,bg=null,lights=[],paused=false,raf=0,t0=performance.now();
const pal={classic:['#f21d3b','#16d96b','#10b9ff','#ffe51b'],ice:['#18d7ff','#4d8dff','#b6f7ff','#52e0b8'],neon:['#ff285d','#b7ff1e','#00e5ff','#ffca28'],mono:['#eeeeee','#aeb7c2','#6b7785','#ffffff']},speed={still:0,slow:.22,normal:.55,fast:1.05,hyper:1.8};
const get=k=>window.WallpaperEngine?.getSetting(k,D[k])??D[k];function hash(n){n=Math.sin(n*12.9898+Number(cfg.seed)*78.233)*43758.5453;return n-Math.floor(n)}function rgb(h){let n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255]}
function facet(b,px,py,s,base,bright){const r=rgb(base),mix=(a)=>`rgb(${Math.min(255,r[0]+a)},${Math.min(255,r[1]+a)},${Math.min(255,r[2]+a)})`;b.fillStyle=mix(bright+18);b.beginPath();b.moveTo(px,py);b.lineTo(px+s,py);b.lineTo(px+s/2,py+s/2);b.closePath();b.fill();b.fillStyle=mix(bright-5);b.beginPath();b.moveTo(px+s,py);b.lineTo(px+s,py+s);b.lineTo(px+s/2,py+s/2);b.closePath();b.fill();b.fillStyle=mix(bright+7);b.beginPath();b.moveTo(px+s,py+s);b.lineTo(px,py+s);b.lineTo(px+s/2,py+s/2);b.closePath();b.fill();b.fillStyle=mix(bright-18);b.beginPath();b.moveTo(px,py+s);b.lineTo(px,py);b.lineTo(px+s/2,py+s/2);b.closePath();b.fill()}
function makeBackground(){const s=Math.max(14,Math.min(72,+cfg.density||34));bg=document.createElement('canvas');bg.width=Math.ceil(W);bg.height=Math.ceil(H);const b=bg.getContext('2d'),dark=(+cfg.darkness||78)/100;b.fillStyle='#07090b';b.fillRect(0,0,W,H);for(let row=0;row<Math.ceil(H/s)+1;row++)for(let col=0;col<Math.ceil(W/s)+1;col++){const n=hash(col*71+row*113),v=Math.max(7,Math.floor((23+n*30)*(1-dark*.5)));facet(b,col*s,row*s,s,`#${((v<<16)|(v*1.06<<8)|(v*1.12)).toString(16).padStart(6,'0')}`,0);b.strokeStyle='rgba(0,0,0,.18)';b.strokeRect(col*s+.5,row*s+.5,s-1,s-1)}
const count=Math.max(4,Math.min(40,+cfg.barCount||18)),colors=pal[cfg.palette]||pal.classic;lights=[];for(let i=0;i<count;i++){const hor=hash(i*4.2)>.48;lights.push({hor,color:colors[i%colors.length],col:Math.floor(hash(i*8.1)*(W/s+8))-4,row:Math.floor(hash(i*13.7)*(H/s+8))-4,length:3+Math.floor(hash(i*3.3)*Math.min(17,Math.max(4,Math.round(Math.max(W,H)/s*.65)))),phase:hash(i*9.1)*20,rate:.5+hash(i*2.1)*.8,s})}}
function drawLight(px,py,s,color,amount,blur){const [r,g,b]=rgb(color);x.save();x.globalAlpha=amount;x.shadowColor=color;x.shadowBlur=blur;x.globalCompositeOperation='lighter';facet(x,px,py,s,`#${((r<<16)|(g<<8)|b).toString(16).padStart(6,'0')}`,Math.round(amount*110));x.restore()}
function resize(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=Math.max(1,Math.floor(W*dpr));c.height=Math.max(1,Math.floor(H*dpr));x.setTransform(dpr,0,0,dpr,0,0);makeBackground()}
function render(now){if(paused)return;const t=(now-t0)/1000,v=speed[cfg.speed]??.55,brightness=(+cfg.brightness||82)/100;x.drawImage(bg,0,0);if(v){for(const l of lights){const cells=Math.max(1,Math.floor(v*l.rate*t*2.2));const maxCol=Math.ceil(W/l.s)+2,maxRow=Math.ceil(H/l.s)+2;let head= l.hor?l.col+cells:l.row+cells;if(l.hor)head=((head%maxCol)+maxCol)%maxCol;else head=((head%maxRow)+maxRow)%maxRow;for(let j=l.length-1;j>=0;j--){const index=head-j, col=l.hor?index:l.col,row=l.hor?l.row:index;const cc=l.hor?((col%maxCol)+maxCol)%maxCol:col,rr=l.hor?row:((row%maxRow)+maxRow)%maxRow;if(cc<0||rr<0||cc>maxCol||rr>maxRow)continue;const fade=Math.pow(1-j/(l.length+1),1.7)*brightness;drawLight(cc*l.s,rr*l.s,l.s-1,l.color,fade,Math.min(24,+cfg.glow||75)*fade)}}}raf=requestAnimationFrame(render)}
function boot(){cfg={};Object.keys(D).forEach(k=>cfg[k]=get(k));cancelAnimationFrame(raf);t0=performance.now();resize();raf=requestAnimationFrame(render)}addEventListener('resize',resize);addEventListener('wallpaperEngineReady',boot);addEventListener('wallpaperUpdate',boot);addEventListener('wallpaperPause',()=>{paused=true;cancelAnimationFrame(raf);raf=0});addEventListener('wallpaperResume',()=>{paused=false;t0=performance.now();if(!raf)raf=requestAnimationFrame(render)});document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});boot()})();</script></body></html>
